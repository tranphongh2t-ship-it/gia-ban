name = "gia-ban-backend"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# --- Cập nhật phần mềm desktop (app-update) ---
# Khi có bản mới: nâng APP_VERSION, đổi APP_INSTALLER_URL thành link download setup mới,
# rồi `wrangler deploy`. 30 máy sẽ tự bật POPUP cập nhật.
[vars]
APP_VERSION = "0.5.6"
APP_INSTALLER_URL = "https://github.com/tranphongh2t-ship-it/gia-ban-releases/releases/download/v0.5.6/THANH.THUY.PRICE_0.5.6_x64-setup.exe"
APP_UPDATE_NOTES = "Tách Xưởng thường OP1/OP2 + Tự lấy hàng + D1 performance fix."

[[d1_databases]]
binding = "DB"
database_name = "gia-ban-db"
database_id = "9b5816ee-a2fd-4711-909f-4c37f81c38d6"  # Cần tạo bằng: wrangler d1 create gia-ban-db
migrations_dir = "migrations"

[env.staging]
name = "gia-ban-backend-staging"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "gia-ban-db-staging"
database_id = ""
migrations_dir = "migrations"
