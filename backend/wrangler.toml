name = "gia-ban-backend"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# --- Cập nhật phần mềm desktop (app-update) ---
# Khi có bản mới: nâng APP_VERSION, đổi APP_INSTALLER_URL thành link download setup mới,
# rồi `wrangler deploy`. 30 máy sẽ tự bật POPUP cập nhật.
[vars]
APP_VERSION = "0.2.11"
APP_INSTALLER_URL = "https://github.com/tranphongh2t-ship-it/gia-ban-releases/releases/latest/download/THANH.THUY.PRICE.Setup.0.2.11.exe"
APP_UPDATE_NOTES = "Bổ sung tính ngăn Ghim Cột, Lọc Cột cho dễ nhìn dữ liệu, Export đầy đủ dữ liệu"

[[d1_databases]]
binding = "DB"
database_name = "gia-ban-db"
database_id = "9b5816ee-a2fd-4711-909f-4c37f81c38d6"  # Cần tạo bằng: wrangler d1 create gia-ban-db
migrations_dir = "migrations"

[env.staging]
name = "gia-ban-backend-staging"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "gia-ban-db-staging"
database_id = ""
migrations_dir = "migrations"
